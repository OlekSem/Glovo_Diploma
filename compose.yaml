services:
  api:
    image: semeniukoleksandr/glovo-app:backend-latest
    build:
      context: ./GlovoBackEnd
      dockerfile: GlovoBackEnd/Dockerfile
      platforms:
        - linux/amd64
    container_name: glovo_backend_api
    restart: always
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - glovo-network

  frontend:
    build:
      context: ./PartnerFront
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
      args:
        - VITE_API_BASE_URL=http://16.192.175.236:5000
    image: semeniukoleksandr/glovo-app:partner-frontend-latest
    container_name: glovo_partner_frontend_app
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - glovo-network
networks:
  glovo-network:
    driver: bridge